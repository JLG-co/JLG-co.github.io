<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="UFvJMk8GzOTCNfZtEinK1wwadAF1B3Zv1o5Uoj0sdjg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Math Companion Pro</title>

  <!-- Redirect after 1 second -->
  <meta http-equiv="refresh" content="1;url=https://math-companion-final-ver.vercel.app/">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: background 0.6s ease;
    }

    /* Gradients per language */
    body.en {
      background: linear-gradient(135deg, #4338ca, #7c3aed);
    }

    body.fr {
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
    }

    body.ar {
      background: linear-gradient(135deg, #166534, #22c55e);
    }

    .card {
      width: 390px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      animation: fadeIn 0.6s ease-out;
    }

    .rtl {
      direction: rtl;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .logo .math { color: #a7f3d0; }
    .logo .companion { color: #fca5a5; }

    .subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 26px;
    }

    .loader {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 1s linear infinite;
    }

    .redirect {
      font-size: 13px;
      opacity: 0.85;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 22px;
      font-size: 13px;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.2);
      transition: 0.25s ease;
    }

    .btn:hover {
      background: rgba(255,255,255,0.35);
    }

    .lang {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.9;
    }

    .lang span {
      margin: 0 6px;
      cursor: pointer;
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="logo">
      <span class="math">Math</span>
      <span class="companion"> Companion Pro</span>
    </div>

    <div class="subtitle" id="subtitle"></div>

    <div class="loader"></div>

    <div class="redirect" id="redirect"></div>

    <a class="btn" id="btn"
       href="https://math-companion-final-ver.vercel.app/">
    </a>

    <div class="lang">
      <span onclick="setEN()">EN</span> |
      <span onclick="setFR()">FR</span> |
      <span onclick="setAR()">AR</span>
    </div>
  </div>

  <script>
    function setEN() {
      document.documentElement.lang = "en";
      document.body.className = "en";
      card.classList.remove("rtl");
      subtitle.innerText = "Your Ultimate Mathematical Learning Platform";
      redirect.innerText = "Redirecting to homepage...";
      btn.innerText = "Click here if not redirected automatically";
    }

    function setFR() {
      document.documentElement.lang = "fr";
      document.body.className = "fr";
      card.classList.remove("rtl");
      subtitle.innerText = "Votre plateforme ultime d’apprentissage des mathématiques";
      redirect.innerText = "Redirection vers la page d’accueil…";
      btn.innerText = "Cliquez ici si la redirection ne fonctionne pas";
    }

    function setAR() {
      document.documentElement.lang = "ar";
      document.body.className = "ar";
      card.classList.add("rtl");
      subtitle.innerText = "منصتك المتكاملة لتعلّم الرياضيات";
      redirect.innerText = "جارٍ تحويلك إلى الصفحة الرئيسية…";
      btn.innerText = "اضغط هنا إذا لم يتم التحويل تلقائيًا";
    }

    // Auto language detection
    const userLang = navigator.language || navigator.userLanguage;

    if (userLang.startsWith("ar")) {
      setAR();
    } else if (userLang.startsWith("fr")) {
      setFR();
    } else {
      setEN();
    }
  </script>

</body>
</html>
